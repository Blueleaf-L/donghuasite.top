<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script>try{if(localStorage.getItem("gcan-theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作品详情 | 国产动画资料库</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <nav class="mobile-dock" id="mobile-dock" aria-label="移动端导航"></nav>

  <main class="site-main">
    <div class="container">

      <nav class="breadcrumb" id="breadcrumb" aria-label="面包屑"></nav>

      <section class="detail-head">
        <div class="dh-cover" id="dh-cover"></div>
        <div class="detail-body">
          <h1 id="dh-title">…</h1>
          <div class="dh-badges" id="dh-badges"></div>
          <div class="dh-meta" id="dh-meta"></div>
          <p class="dh-note">评级仅供参考，作品质量请以自身观看体验为准。</p>
        </div>
      </section>

      <section class="detail-block">
        <h2>简介 <span class="sub">synopsis</span></h2>
        <p class="synopsis" id="synopsis">简介整理中。</p>
      </section>

      <section class="detail-block">
        <h2>评分 <span class="sub">定期更新，非实时数据</span></h2>
        <div class="score-grid" id="score-grid"></div>
      </section>

      <section class="detail-block">
        <h2>详细信息 <span class="sub" id="info-sub"></span></h2>
        <table class="info-table" id="info-table"><tbody></tbody></table>
      </section>

      <section class="detail-block" id="series-block" hidden>
        <h2>系列作品 <span class="sub">同 IP 关联条目，按年份排序</span></h2>
        <div class="h-scroll" id="series-list"></div>
      </section>

    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="tv-data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/work-detail.js"></script>
</body>
</html>
