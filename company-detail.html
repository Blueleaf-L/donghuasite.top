<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script>try{if(localStorage.getItem("gcan-theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>公司详情 | 国产动画资料库</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <nav class="mobile-dock" id="mobile-dock" aria-label="移动端导航"></nav>

  <main class="site-main">
    <div class="container">

      <nav class="breadcrumb" id="breadcrumb" aria-label="面包屑"></nav>

      <section class="detail-head">
        <div class="detail-body">
          <h1 id="dh-name">…</h1>
          <div class="dh-badges" id="dh-badges"></div>
          <div class="dh-meta" id="dh-meta"></div>
        </div>
      </section>

      <!-- 能力概览：KPI 指标卡 + 评级分布条（替代雷达图） -->
      <section class="detail-block">
        <h2>能力概览 <span class="sub">客观统计，不含评分</span></h2>
        <div class="kpi-grid" id="kpi-grid"></div>
        <div class="grade-dist" id="grade-dist" style="margin-top:var(--sp-4)"></div>
        <div class="grade-dist-legend" id="grade-dist-legend"></div>
      </section>

      <!-- 作品时间线 -->
      <section class="detail-block">
        <div class="section-head">
          <h2>作品时间线 <span class="sub" id="tl-sub"></span></h2>
          <div class="head-side">
            <div class="year-range">
              <input type="number" id="f-year-from" min="1970" max="2030" placeholder="起" aria-label="起始年份">
              <span>至</span>
              <input type="number" id="f-year-to" min="1970" max="2030" placeholder="止" aria-label="结束年份">
            </div>
            <div class="h-timeline-nav">
              <button type="button" class="btn" id="tl-prev" aria-label="向左">←</button>
              <button type="button" class="btn" id="tl-next" aria-label="向右">→</button>
            </div>
          </div>
        </div>
        <div class="h-timeline" id="timeline"></div>
      </section>

      <!-- 旗下作品 -->
      <section class="detail-block">
        <div class="section-head">
          <h2>旗下作品 <span class="sub" id="works-sub"></span></h2>
          <div class="head-side">
            <div class="chip-group" id="f-grade"></div>
            <div class="sort-box">
              <label for="f-sort">排序</label>
              <select id="f-sort">
                <option value="year-desc">年份（新 → 旧）</option>
                <option value="year-asc">年份（旧 → 新）</option>
                <option value="grade">评级（优 → 差）</option>
              </select>
            </div>
          </div>
        </div>
        <div class="work-grid work-grid--wide" id="work-grid" style="margin-top:var(--sp-4)"></div>
      </section>

    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="tv-data.js"></script>
  <script src="companies.js"></script>
  <script src="js/common.js"></script>
  <script src="js/company-detail.js"></script>
</body>
</html>
