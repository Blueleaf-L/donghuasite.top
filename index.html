<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script>try{if(localStorage.getItem("gcan-theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>国产动画资料库 | 国产动画，一处可查</title>

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <nav class="mobile-dock" id="mobile-dock" aria-label="移动端导航"></nav>

  <main class="site-main">
    <div class="container">

      <section class="site-hero">
        <h1 class="hero-title">国产动画，一处可查</h1>
        <p class="hero-sub">剧集 · 电影 · 制作公司 · 评分与评级，独立于平台之外的中立档案。</p>
        <p class="stat-line-hero">
          <span class="stat">已收录 <strong id="stat-total">…</strong> 部作品</span>
          <span class="sep"></span>
          <span class="stat"><strong id="stat-company">…</strong> 家制作公司</span>
        </p>
      </section>

      <div id="search-box"></div>

      <section class="home-block reveal">
        <div class="h-scroll-head">
          <h2>年度推荐 · 强推荐</h2>
          <span class="sub">评级仅供参考，作品质量请以自身观看体验为准。</span>
          <div class="h-scroll-nav">
            <button type="button" class="btn" id="top-works-prev" aria-label="上一组">←</button>
            <button type="button" class="btn" id="top-works-next" aria-label="下一组">→</button>
          </div>
        </div>
        <div class="h-scroll" id="top-works"></div>
      </section>

      <section class="home-block reveal">
        <div class="section-head"><h2>模块入口</h2></div>
        <div class="entry-grid">
          <a class="entry-card" href="series.html" style="--ec-fg:var(--jade);--ec-bg:var(--jade-soft);">
            <div class="ec-icon">剧</div>
            <h3>剧集动画</h3>
            <p class="ec-desc">按平台、技术类型、题材、评级组合筛选，快速检索每一部作品。</p>
            <span class="ec-go">进入</span>
          </a>
          <a class="entry-card" href="movies.html" style="--ec-fg:var(--accent);--ec-bg:var(--accent-soft);">
            <div class="ec-icon">影</div>
            <h3>动画电影</h3>
            <p class="ec-desc">院线与网络动画电影，附票房排行榜。</p>
            <span class="ec-go">进入</span>
          </a>
          <a class="entry-card" href="company.html" style="--ec-fg:var(--gold);--ec-bg:var(--gold-soft);">
            <div class="ec-icon">司</div>
            <h3>公司总览</h3>
            <p class="ec-desc">按公司聚合旗下作品，查看产能与品控指标。</p>
            <span class="ec-go">进入</span>
          </a>
          <a class="entry-card" href="industry.html" style="--ec-fg:var(--cinnabar);--ec-bg:var(--cinnabar-soft);">
            <div class="ec-icon">图</div>
            <h3>数据统计</h3>
            <p class="ec-desc">年度产量、技术类型、推荐率走势等图表，观察整体走向。</p>
            <span class="ec-go">进入</span>
          </a>
        </div>
      </section>

    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="tv-data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/index.js"></script>
