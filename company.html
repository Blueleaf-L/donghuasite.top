<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script>try{if(localStorage.getItem("gcan-theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>公司总览 | 国产动画资料库</title>
  <meta name="description" content="国产动画制作公司总览：按公司聚合旗下作品，查看产能、品控与制作类型分布。">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <nav class="mobile-dock" id="mobile-dock" aria-label="移动端导航"></nav>

  <main class="site-main">
    <div class="container">

      <section class="page-head">
        <span class="eyebrow">STUDIOS · 公司</span>
        <h1>公司总览</h1>
        <p class="sub">按公司聚合旗下剧集动画与动画电影，查看产能、品控指标与制作类型。已评级作品不足 3 部的公司显示「样本不足」，不参与品控排序。</p>
        <p class="stat-line">
          <span class="stat-chip">共收录 <strong id="stat-count">…</strong> 家制作公司</span>
        </p>
      </section>

      <section class="filter-panel" aria-label="公司筛选">
        <div class="filter-row">
          <span class="f-label">关键词</span>
          <div class="filter-search">
            <input type="search" id="f-q" placeholder="搜索公司名…" aria-label="公司名搜索">
          </div>
          <span class="f-label">类型</span>
          <div class="chip-group" id="f-tech"></div>
        </div>
      </section>

      <section class="chart-box">
        <h2>制作类型分布</h2>
        <p class="sub">X 轴作品数（产能）· Y 轴推荐率（品控）· 气泡大小作品数 · 颜色制作类型。灰色气泡为样本不足公司。</p>
        <div class="chart chart--sm" id="bubble-chart"></div>
      </section>

      <div class="list-toolbar">
        <p class="result-count">共 <strong id="result-count">0</strong> 家公司</p>
        <div class="sort-box">
          <label for="f-sort">排序</label>
          <select id="f-sort">
            <option value="works">作品数（多 → 少）</option>
            <option value="years">活跃年份数（多 → 少）</option>
            <option value="rate">推荐率（高 → 低）</option>
          </select>
        </div>
      </div>

      <div id="company-list"></div>

    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/echarts.min.js"></script>
  <script src="tv-data.js"></script>
  <script src="companies.js"></script>
  <script src="js/common.js"></script>
  <script src="js/company.js"></script>
</body>
</html>
