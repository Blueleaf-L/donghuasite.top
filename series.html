<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script>try{if(localStorage.getItem("gcan-theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>剧集动画 | 国产动画资料库</title>
  <meta name="description" content="国产剧集动画信息检索：按平台、技术类型、题材、评级组合筛选。">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <nav class="mobile-dock" id="mobile-dock" aria-label="移动端导航"></nav>

  <main class="site-main">
    <div class="container">

      <section class="page-head">
        <span class="eyebrow">SERIES · 剧集</span>
        <h1>剧集动画</h1>
        <p class="sub">收录网络平台与电视渠道的国产剧集动画，可组合筛选关键词、年份、技术类型、改编来源与评级。</p>
        <p class="stat-line">
          <span class="stat-chip">共收录 <strong id="stat-count">…</strong> 部</span>
        </p>
      </section>

      <section class="filter-panel" id="filter-panel" aria-label="作品筛选">
        <div class="filter-row">
          <span class="f-label">关键词</span>
          <div class="filter-search">
            <input type="search" id="f-q" placeholder="搜索作品名、导演、公司…" aria-label="关键词搜索">
          </div>
          <span class="f-label">年份</span>
          <div class="year-range">
            <input type="number" id="f-year-from" min="1970" max="2030" placeholder="起" aria-label="起始年份">
            <span>至</span>
            <input type="number" id="f-year-to" min="1970" max="2030" placeholder="止" aria-label="结束年份">
          </div>
        </div>
        <div class="filter-row">
          <span class="f-label">类型</span>
          <div class="chip-group" id="f-tech"></div>
        </div>
        <div class="filter-row">
          <span class="f-label">改编</span>
          <div class="chip-group" id="f-adaptation"></div>
        </div>
        <div class="filter-row">
          <span class="f-label">评级</span>
          <div class="chip-group" id="f-grade"></div>
        </div>
      </section>

      <div class="list-toolbar">
        <p class="result-count">共 <strong id="result-count">0</strong> 部作品</p>
        <div class="sort-box">
          <label for="f-sort">排序</label>
          <select id="f-sort">
            <option value="year-desc">年份（新 → 旧）</option>
            <option value="year-asc">年份（旧 → 新）</option>
            <option value="grade">评级（优 → 差）</option>
            <option value="name">名称（字母序）</option>
          </select>
        </div>
      </div>

      <div class="work-grid" id="work-grid"></div>

      <div class="load-more-wrap" id="load-more-wrap" hidden>
        <button type="button" class="btn" id="load-more">展示更多</button>
      </div>

    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="tv-data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/series.js"></script>
</body>
</html>
