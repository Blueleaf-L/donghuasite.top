<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script>try{if(localStorage.getItem("gcan-theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>动画电影 | 国产动画资料库</title>
  <meta name="description" content="国产动画电影信息检索：院线与网络动画电影，附票房排行榜。">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <nav class="mobile-dock" id="mobile-dock" aria-label="移动端导航"></nav>

  <main class="site-main">
    <div class="container">

      <section class="page-head">
        <span class="eyebrow">MOVIES · 电影</span>
        <h1>动画电影</h1>
        <p class="sub">收录院线动画电影与网络动画电影（网大）。院线电影附票房，网大显示「网络上映」、不参与票房排行。</p>
        <p class="stat-line">
          <span class="stat-chip">共收录 <strong id="stat-count">…</strong> 部</span>
          <span class="sep"></span>
          <span class="stat-chip">院线 <strong id="stat-cinema">…</strong> 部</span>
          <span class="sep"></span>
          <span class="stat-chip">网络上映 <strong id="stat-web">…</strong> 部</span>
        </p>
      </section>

      <!-- 票房排行榜（置于筛选上方） -->
      <section class="list-panel" id="box-office-panel" style="margin-top:var(--sp-5)">
        <div class="lp-head">
          <h2>票房排行榜</h2>
          <span class="cnt">仅统计院线电影</span>
        </div>
        <div id="box-office-list"></div>
      </section>

      <section class="filter-panel" id="filter-panel" aria-label="电影筛选">
        <div class="filter-row">
          <span class="f-label">关键词</span>
          <div class="filter-search">
            <input type="search" id="f-q" placeholder="搜索片名、导演、公司…" aria-label="关键词搜索">
          </div>
          <span class="f-label">年份</span>
          <div class="year-range">
            <input type="number" id="f-year-from" min="1970" max="2030" placeholder="起" aria-label="起始年份">
            <span>至</span>
            <input type="number" id="f-year-to" min="1970" max="2030" placeholder="止" aria-label="结束年份">
          </div>
        </div>
        <div class="filter-row">
          <span class="f-label">类型</span>
          <div class="chip-group" id="f-tech"></div>
        </div>
        <div class="filter-row">
          <span class="f-label">改编</span>
          <div class="chip-group" id="f-adaptation"></div>
        </div>
        <div class="filter-row">
          <span class="f-label">评级</span>
          <div class="chip-group" id="f-grade"></div>
        </div>
        <div class="filter-row">
          <span class="f-label">状态</span>
          <div class="chip-group" id="f-status"></div>
        </div>
      </section>

      <div class="list-toolbar">
        <p class="result-count">共 <strong id="result-count">0</strong> 部电影</p>
        <div class="sort-box">
          <label for="f-sort">排序</label>
          <select id="f-sort">
            <option value="year-desc">年份（新 → 旧）</option>
            <option value="year-asc">年份（旧 → 新）</option>
            <option value="grade">评级（优 → 差）</option>
            <option value="name">名称（字母序）</option>
          </select>
        </div>
      </div>

      <div class="work-grid" id="work-grid"></div>

      <div class="load-more-wrap" id="load-more-wrap" hidden>
        <button type="button" class="btn" id="load-more">展示更多</button>
      </div>

    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="tv-data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/movies.js"></script>
</body>
</html>
